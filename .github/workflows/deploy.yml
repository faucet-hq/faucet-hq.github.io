name: Deploy to GitHub Pages

# Dual-environment publish (mirrors the pattern in pawansikawat.github.io):
#   main → site root            → https://faucet-hq.github.io/
#   dev  → /dev/ subdirectory   → https://faucet-hq.github.io/dev/  (staging preview)
# The dev deploy is optional — if the dev branch is absent, only production ships.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Detect dev branch
        id: dev
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" dev >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout dev
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main/package-lock.json

      # Publish the API control-plane spec on-domain (single source of truth is the
      # library repo, fetched at build so it never drifts). Best-effort: a fetch
      # failure must not fail the site build.
      - name: Fetch OpenAPI spec (on-domain)
        run: |
          URL="https://raw.githubusercontent.com/faucet-hq/faucet-stream/main/docs/openapi.yaml"
          curl -fsSL "$URL" -o main/public/openapi.yaml || echo "warn: OpenAPI fetch failed; keeping any committed copy"
          if [ -d dev ]; then cp -f main/public/openapi.yaml dev/public/openapi.yaml 2>/dev/null || true; fi

      - name: Build main (base /)
        working-directory: main
        run: |
          npm ci
          npm run build

      - name: Assemble site root
        run: |
          mkdir -p site
          cp -r main/dist/. site/

      - name: Build dev (base /dev/)
        if: steps.dev.outputs.exists == 'true'
        working-directory: dev
        env:
          BASE_PATH: /dev/
        run: |
          npm ci
          npm run build

      - name: Add dev preview under /dev/
        if: steps.dev.outputs.exists == 'true'
        run: |
          mkdir -p site/dev
          cp -r dev/dist/. site/dev/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
